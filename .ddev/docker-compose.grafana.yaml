services:
  grafana:
    container_name: "ddev-${DDEV_SITENAME}-grafana"
    image: grafana/grafana:latest
    restart: "no"
    expose:
      - "3000"
    environment:
      - VIRTUAL_HOST=${DDEV_HOSTNAME}
      - HTTP_EXPOSE=3000:3000
      - HTTPS_EXPOSE=3001:3000
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  grafana-data:
