global-styling:
  version: 5.2
  js:
    js/global.js: {}
  dependencies:
    - core/drupal
    - core/once
  css:
    component:
      css/style.css: {}
      css/colors.css: {}
      css/unhabitat.css: {}
      css/projects.css: {}
bootstrap:
  js:
    /libraries/popperjs/dist/umd/popper.min.js: { weight: -19 }
    /libraries/bootstrap/dist/js/bootstrap.min.js: { weight: -20 }
  css:
    component:
      /libraries/bootstrap/dist/css/bootstrap.min.css: {}
